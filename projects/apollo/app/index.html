<title>Apollo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhai+2:wght@600;800&family=Hind+Vadodara:wght@400;500;600&display=swap">
<style>
/* Layout: a single phone-width column. A bandhani-dotted indigo band carries the
   brand and the day's numbers; everything below is calm cards on a cool ground. */
:root {
  --bg: #F2F3F9;
  --surface: #FFFFFF;
  --sunk: #E7E9F4;
  --ink: #1A1E3A;
  --muted: #585F80;
  --line: #D8DBEA;
  --indigo: #283887;
  --indigo-ink: #FFFFFF;
  --madder: #B3261E;
  --ochre: #C8860D;
  --ok: #1D7A4B;
  --ok-soft: #DDF2E6;
  --bad: #B3261E;
  --bad-soft: #F8E1DF;
  --band: #1F2C6E;
  --dot: rgba(255,255,255,.16);
  --dot2: rgba(232,92,80,.55);
  --display: "Baloo Bhai 2", "Hind Vadodara", ui-rounded, system-ui, sans-serif;
  --body: "Hind Vadodara", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r: 14px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0E1124; --surface: #181C36; --sunk: #222746; --ink: #ECEEF8; --muted: #A2A7C6; --line: #2C3157;
  --indigo: #8C9AF0; --indigo-ink: #0E1124; --madder: #F07267; --ochre: #F0B640; --ok: #5BC98D; --ok-soft: #173426;
  --bad: #F07267; --bad-soft: #3A1D20; --band: #18205A; --dot: rgba(255,255,255,.10); --dot2: rgba(240,114,103,.45);
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0E1124; --surface: #181C36; --sunk: #222746; --ink: #ECEEF8; --muted: #A2A7C6; --line: #2C3157;
  --indigo: #8C9AF0; --indigo-ink: #0E1124; --madder: #F07267; --ochre: #F0B640; --ok: #5BC98D; --ok-soft: #173426;
  --bad: #F07267; --bad-soft: #3A1D20; --band: #18205A; --dot: rgba(255,255,255,.10); --dot2: rgba(240,114,103,.45);
  color-scheme: dark; }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 16px/1.5 var(--body); margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, a:focus-visible, input:focus-visible { outline: 3px solid var(--ochre); outline-offset: 2px; }
.wrap { max-width: 560px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* brand band — bandhani dots */
.band { background-color: var(--band); color: #fff;
  background-image: radial-gradient(circle at 50% 50%, var(--dot2) 0 2.5px, transparent 3px), radial-gradient(circle at 50% 50%, var(--dot) 0 2px, transparent 2.5px);
  background-size: 22px 22px, 22px 22px; background-position: 0 0, 11px 11px; }
.band .wrap { padding-block: 18px 16px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.brand { font: 800 30px/1 var(--display); letter-spacing: .5px; margin: 0; }
.brand small { display: block; font: 500 13px/1.3 var(--body); opacity: .85; letter-spacing: 0; }
.stats { margin-left: auto; display: flex; gap: 8px; }
.stat { background: rgba(0,0,0,.28); border-radius: 999px; padding: 4px 12px; font: 600 14px/1.6 var(--body); font-variant-numeric: tabular-nums; white-space: nowrap; }
.stat b { color: #FFD27A; }

main .wrap { padding-block: 18px 48px; display: grid; gap: 18px; }
h2 { font: 800 22px/1.2 var(--display); margin: 0; text-wrap: balance; }
h3 { font: 700 17px/1.3 var(--display); margin: 0; }
.eyebrow { font: 600 12px/1 var(--body); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.muted { color: var(--muted); }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }

/* daily goal */
.goal { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; display: grid; gap: 8px; }
.meter { height: 10px; background: var(--sunk); border-radius: 99px; overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--ochre); border-radius: 99px; transition: width .4s; }

/* quick actions */
.quick { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 10px; }
.qbtn { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 8px; text-align: center; display: grid; gap: 2px; }
.qbtn strong { font: 800 22px/1.1 var(--display); color: var(--indigo); font-variant-numeric: tabular-nums; }
.qbtn span { font-size: 13px; color: var(--muted); }

/* unit path */
.unit { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; display: grid; gap: 12px; }
.unit-head { display: flex; gap: 12px; align-items: flex-start; }
.unit-head > div { min-width: 0; }
.tag { display: inline-block; font: 600 11px/1 var(--body); letter-spacing: .06em; text-transform: uppercase; padding: 4px 7px; border-radius: 6px; background: var(--sunk); color: var(--muted); white-space: nowrap; }
.tag.dialect { background: var(--madder); color: var(--surface); }
.nodes { display: flex; gap: 10px; flex-wrap: wrap; }
.node { width: 52px; height: 52px; border-radius: 50%; border: 3px solid var(--indigo); background: var(--surface); color: var(--indigo); font: 800 18px/1 var(--display); display: grid; place-items: center; }
.node.done { background: var(--indigo); color: var(--indigo-ink); }
.node.next { box-shadow: 0 0 0 5px color-mix(in srgb, var(--ochre) 45%, transparent); }

.scenes { display: grid; gap: 10px; }
.scene-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; text-align: left; display: grid; gap: 2px; }
.scene-card.done h3::after { content: "  ✓"; color: var(--ok); }

.toolbar { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 14px; font-size: 14px; }
.chip[aria-pressed="true"] { background: var(--indigo); color: var(--indigo-ink); border-color: var(--indigo); }

/* exercise screen */
.ex { display: grid; gap: 16px; }
.topbar { display: flex; align-items: center; gap: 12px; }
.x { border: 0; background: none; font-size: 26px; line-height: 1; padding: 4px 8px; color: var(--muted); }
.progress { flex: 1; height: 12px; background: var(--sunk); border-radius: 99px; overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--ok); transition: width .3s; }
.prompt { font: 800 26px/1.25 var(--display); margin: 0; text-wrap: balance; overflow-wrap: anywhere; }
.big-play { width: 88px; height: 88px; border-radius: 22px; border: 0; background: var(--indigo); color: var(--indigo-ink); font-size: 34px; display: grid; place-items: center; }
.slow { border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 8px 12px; font-size: 14px; }
.opts { display: grid; gap: 10px; }
.opt { text-align: left; background: var(--surface); border: 2px solid var(--line); border-bottom-width: 4px; border-radius: var(--r); padding: 12px 16px; font-size: 18px; overflow-wrap: anywhere; }
.opt:active { transform: translateY(2px); border-bottom-width: 2px; }
.opt.right { border-color: var(--ok); background: var(--ok-soft); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.opt[disabled] { cursor: default; }
.tiles, .answer-line { display: flex; gap: 8px; flex-wrap: wrap; min-height: 52px; }
.answer-line { border-bottom: 2px solid var(--line); padding-bottom: 8px; }
.tile { background: var(--surface); border: 2px solid var(--line); border-bottom-width: 4px; border-radius: 12px; padding: 6px 12px; font-size: 18px; }
.tile.used { visibility: hidden; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; display: grid; gap: 10px; }
.roman { font: 800 30px/1.2 var(--display); color: var(--indigo); overflow-wrap: anywhere; }
.meaning { font-size: 18px; }
.note { font-size: 14px; color: var(--muted); border-left: 3px solid var(--ochre); padding-left: 10px; }
.src { font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
.src a { color: inherit; }

.primary { background: var(--indigo); color: var(--indigo-ink); border: 0; border-radius: var(--r); padding: 14px 18px; font: 800 18px/1 var(--display); width: 100%; }
.secondary { background: var(--surface); border: 2px solid var(--line); border-radius: var(--r); padding: 12px 18px; font: 700 16px/1 var(--display); width: 100%; }
.pair { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.feedback { border-radius: var(--r); padding: 14px 16px; display: grid; gap: 8px; }
.feedback.good { background: var(--ok-soft); color: var(--ok); }
.feedback.bad { background: var(--bad-soft); color: var(--bad); }
.feedback .ans { color: var(--ink); font-size: 17px; }

/* scene chat */
.chat { display: grid; gap: 10px; }
.bubble { max-width: 86%; padding: 10px 14px; border-radius: 16px; display: grid; gap: 4px; overflow-wrap: anywhere; }
.bubble.them { background: var(--surface); border: 1px solid var(--line); border-bottom-left-radius: 4px; justify-self: start; }
.bubble.you { background: var(--indigo); color: var(--indigo-ink); border-bottom-right-radius: 4px; justify-self: end; }
.bubble .who { font: 600 12px/1 var(--body); letter-spacing: .06em; text-transform: uppercase; opacity: .7; }
.bubble .r { font: 700 19px/1.3 var(--display); }
.bubble .e { font-size: 14px; opacity: .8; }
.bubble button.play { justify-self: start; border: 0; background: var(--sunk); color: var(--ink); border-radius: 8px; padding: 2px 10px; font-size: 14px; }

/* phrasebook + family */
.search { width: 100%; padding: 12px 14px; border-radius: var(--r); border: 1px solid var(--line); background: var(--surface); color: var(--ink); font: inherit; }
.list { display: grid; gap: 8px; }
.item { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; display: grid; grid-template-columns: auto minmax(0,1fr); gap: 4px 12px; align-items: start; }
.item .play { grid-row: span 3; width: 40px; height: 40px; border-radius: 10px; border: 0; background: var(--sunk); color: var(--indigo); font-size: 16px; }
.item .r { font: 700 18px/1.3 var(--display); }
.verdict { display: flex; gap: 8px; flex-wrap: wrap; grid-column: 2; }
.verdict button { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 6px 12px; font-size: 14px; }
.verdict button[aria-pressed="true"].yes { background: var(--ok); color: var(--surface); border-color: var(--ok); }
.verdict button[aria-pressed="true"].no { background: var(--bad); color: var(--surface); border-color: var(--bad); }
.verdict input { flex: 1 1 180px; min-width: 0; padding: 6px 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); font: inherit; font-size: 14px; }

.voice-warn { font-size: 13px; color: var(--muted); background: var(--sunk); border-radius: 10px; padding: 8px 12px; }
.done-hero { text-align: center; display: grid; gap: 10px; justify-items: center; padding-block: 24px; }
.done-hero .xp { font: 800 54px/1 var(--display); color: var(--ochre); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
@keyframes pop { from { transform: scale(.96); opacity: .4; } to { transform: none; opacity: 1; } }
.ex > * { animation: pop .18s ease-out; }
</style>

<header class="band">
  <div class="wrap">
    <h1 class="brand">Apollo<small>Spoken Gujarati, the SKLPC way</small></h1>
    <div class="stats" aria-label="Your progress">
      <span class="stat" title="Day streak">🔥 <b id="streak">0</b></span>
      <span class="stat" title="Total XP">XP <b id="xp">0</b></span>
    </div>
  </div>
</header>
<main><div class="wrap" id="view" aria-live="polite"></div></main>

<script src="data.js"></script>
<script src="app.js"></script>
