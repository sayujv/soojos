<title>Apollo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhai+2:wght@500;700;800&family=Hind+Vadodara:wght@400;500;600&display=swap">
<style>
/* Layout: phone-first app shell. Sticky stats bar, one scrolling view, fixed tab bar.
   Identity: Kutch textiles — ajrakh indigo ground, madder and turmeric accents, bandhani
   dots and abhla (mirror-work) rings as the only ornament. Each unit is a stop on the road
   to the chovis gaam, coloured from the ajrakh dye pot. */
:root {
  --bg: #EEF0F8;
  --surface: #FFFFFF;
  --sunk: #E2E5F2;
  --ink: #171B36;
  --muted: #5A6185;
  --line: #D4D8EA;
  --indigo: #2A3990;
  --on-indigo: #FFFFFF;
  --madder: #B8312A;
  --turmeric: #E4A11B;
  --gold: #D9920B;
  --leaf: #2E7D4F;
  --ok: #1F8150;
  --ok-soft: #DCF3E5;
  --bad: #B8312A;
  --bad-soft: #F9E0DD;
  --band: #1B2766;
  --shadow: 0 1px 0 rgba(23,27,54,.06), 0 6px 18px -8px rgba(23,27,54,.25);
  --u-greet: #2A3990; --u-family: #B8312A; --u-food: #C77A0A; --u-daily: #2E7D4F;
  --u-feel: #A03070; --u-call: #1F6F8B; --u-kutch: #3B2A6E;
  --u-respect: #8C4A14; --u-kin2: #5E35B1; --u-learner: #00796B; --u-banter: #C4501A; --u-care: #4F6573; --u-samaj: #9E3D22; --u-occasions: #8F6400;
  --display: "Baloo Bhai 2", "Hind Vadodara", ui-rounded, system-ui, sans-serif;
  --body: "Hind Vadodara", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r: 18px;
  --tabh: 64px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0D1022; --surface: #171B34; --sunk: #21264A; --ink: #ECEEFA; --muted: #A3A9CB; --line: #2B315C;
  --indigo: #93A0F5; --on-indigo: #0D1022; --madder: #F27B6F; --turmeric: #F5BC45; --gold: #F5BC45; --leaf: #63C98F;
  --ok: #5FCB90; --ok-soft: #15301F; --bad: #F27B6F; --bad-soft: #3A1C1F; --band: #141B4D;
  --shadow: 0 1px 0 rgba(0,0,0,.4), 0 8px 22px -10px rgba(0,0,0,.7);
  --u-greet: #3B4CB0; --u-family: #B23A33; --u-food: #A9680C; --u-daily: #2C7149; --u-feel: #923068; --u-call: #1E6680; --u-kutch: #4A3787;
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0D1022; --surface: #171B34; --sunk: #21264A; --ink: #ECEEFA; --muted: #A3A9CB; --line: #2B315C;
  --indigo: #93A0F5; --on-indigo: #0D1022; --madder: #F27B6F; --turmeric: #F5BC45; --gold: #F5BC45; --leaf: #63C98F;
  --ok: #5FCB90; --ok-soft: #15301F; --bad: #F27B6F; --bad-soft: #3A1C1F; --band: #141B4D;
  --shadow: 0 1px 0 rgba(0,0,0,.4), 0 8px 22px -10px rgba(0,0,0,.7);
  --u-greet: #3B4CB0; --u-family: #B23A33; --u-food: #A9680C; --u-daily: #2C7149; --u-feel: #923068; --u-call: #1E6680; --u-kutch: #4A3787;
  color-scheme: dark; }

* { box-sizing: border-box; }
html, body { min-height: 100%; }
body { background: var(--bg); color: var(--ink); font: 16px/1.5 var(--body); margin: 0; -webkit-tap-highlight-color: transparent; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, a:focus-visible, input:focus-visible { outline: 3px solid var(--turmeric); outline-offset: 2px; }
.gut { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.col { max-width: 560px; margin: 0 auto; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
h2 { font: 800 24px/1.15 var(--display); }
h3 { font: 700 18px/1.25 var(--display); }
p { margin: 0; }
.muted { color: var(--muted); }
.eyebrow { font: 600 12px/1 var(--body); letter-spacing: .09em; text-transform: uppercase; color: var(--muted); }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }

/* bandhani + abhla ornaments */
.bandhani {
  background-color: var(--band);
  background-image:
    radial-gradient(circle, rgba(242,123,111,.55) 0 2.4px, transparent 2.9px),
    radial-gradient(circle, rgba(255,255,255,.16) 0 1.8px, transparent 2.3px);
  background-size: 20px 20px, 20px 20px; background-position: 0 0, 10px 10px;
}

/* ── top bar ── */
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--band); }
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; color: #fff; }
.topbar .col { display: flex; align-items: center; gap: 8px; padding-block: 10px; }
.brand { font: 800 24px/1 var(--display); letter-spacing: .3px; margin-right: auto; display: flex; align-items: center; gap: 8px; }
.brand .sun { width: 22px; height: 22px; border-radius: 50%; background: radial-gradient(circle at 50% 50%, #FFD35A 0 45%, #E4A11B 46% 60%, transparent 61%), repeating-conic-gradient(#FFD35A 0 10deg, transparent 10deg 30deg); }
.pill { display: inline-flex; align-items: center; gap: 5px; background: rgba(0,0,0,.3); border: 1px solid rgba(255,255,255,.14); border-radius: 999px; padding: 3px 10px 3px 6px; font: 700 15px/1.5 var(--display); font-variant-numeric: tabular-nums; white-space: nowrap; color: #fff; }
.pill svg { width: 20px; height: 20px; flex: none; }
.pill.cold { opacity: .6; }
.ring-pill { padding: 3px 6px; }

/* ── main view ── */
main { padding-bottom: calc(var(--tabh) + env(safe-area-inset-bottom, 0px) + 24px); }
main.focus { padding-bottom: 32px; }
#view { padding-block: 18px; display: grid; gap: 18px; }

/* ── tab bar ── */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
.tabs .col { display: grid; grid-template-columns: repeat(5, minmax(0,1fr)); height: var(--tabh); }
.tab { border: 0; background: none; display: grid; justify-items: center; align-content: center; gap: 2px; font: 600 12px/1 var(--body); color: var(--muted); position: relative; }
.tab svg { width: 26px; height: 26px; }
.tab[aria-current="page"] { color: var(--indigo); }
.tab[aria-current="page"]::before { content: ""; position: absolute; top: 0; left: 30%; right: 30%; height: 3px; border-radius: 0 0 3px 3px; background: var(--indigo); }
.tab .dot { position: absolute; top: 8px; left: calc(50% + 8px); min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--madder); color: #fff; font: 700 11px/18px var(--body); }
body.focus .tabs { display: none; }

/* ── Ba guide card ── */
.guide { display: grid; grid-template-columns: auto minmax(0,1fr); gap: 12px; align-items: center; }
.avatar { width: 60px; height: 60px; border-radius: 50%; display: grid; place-items: center; font: 800 26px/1 var(--display); color: #fff; position: relative; flex: none; padding-top: 4px;
  background-color: var(--madder);
  background-image: radial-gradient(circle, rgba(255,255,255,.35) 0 1.6px, transparent 2px); background-size: 10px 10px;
  box-shadow: 0 0 0 3px var(--surface), 0 0 0 5px var(--turmeric); }
.avatar span { position: absolute; bottom: -6px; background: var(--ink); color: var(--bg); font: 700 11px/1 var(--body); padding: 3px 7px; border-radius: 99px; }
.speech { background: var(--surface); border-radius: var(--r); padding: 12px 14px; position: relative; box-shadow: var(--shadow); border: 0; text-align: left; display: grid; gap: 2px; }
.speech::before { content: ""; position: absolute; left: -7px; top: 50%; width: 14px; height: 14px; background: var(--surface); transform: translateY(-50%) rotate(45deg); border-radius: 2px; }
.speech b { font: 700 18px/1.25 var(--display); color: var(--indigo); position: relative; }
.speech small { font-size: 14px; color: var(--muted); position: relative; }

/* ── today strip ── */
.today { background: var(--surface); border-radius: var(--r); padding: 14px 16px; box-shadow: var(--shadow); display: grid; grid-template-columns: auto minmax(0,1fr); gap: 14px; align-items: center; }
.today .ring { width: 64px; height: 64px; }
.today h3 { font-size: 17px; }
.week { display: flex; gap: 6px; margin-top: 6px; }
.week i { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font: 700 11px/1 var(--body); font-style: normal; background: var(--sunk); color: var(--muted); }
.week i.on { background: var(--turmeric); color: #3A2600; }
.week i.now { box-shadow: 0 0 0 2px var(--indigo); }

/* ── journey path ── */
.stop { display: grid; gap: 10px; }
.banner { color: #fff; border-radius: var(--r); padding: 14px 16px; display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 4px 12px; align-items: center; position: relative; overflow: hidden; box-shadow: var(--shadow); }
.banner::after { content: ""; position: absolute; right: -18px; top: -18px; width: 110px; height: 110px; opacity: .22;
  background: radial-gradient(circle, transparent 0 9px, #fff 10px 12px, transparent 13px) 0 0/36px 36px, radial-gradient(circle, #fff 0 3px, transparent 4px) 18px 18px/36px 36px; }
.banner .eyebrow { color: rgba(255,255,255,.8); }
.banner h3 { font-size: 21px; }
.banner p { font-size: 14px; opacity: .9; }
.banner .count { grid-row: 1 / span 3; grid-column: 2; font: 800 15px/1 var(--display); background: rgba(0,0,0,.25); border-radius: 12px; padding: 8px 10px; font-variant-numeric: tabular-nums; position: relative; z-index: 1; }
.banner .tag { position: relative; z-index: 1; justify-self: start; }
.path { display: grid; justify-items: center; gap: 14px; padding-block: 6px 10px; }
.node { --x: 0px; transform: translateX(var(--x)); width: 70px; height: 66px; border: 0; border-radius: 50%; position: relative; display: grid; place-items: center; font: 800 22px/1 var(--display);
  background: var(--sunk); color: var(--muted); box-shadow: inset 0 -6px 0 rgba(0,0,0,.14); }
.node.done { background: var(--gold); color: #3A2600; }
.node.next { background: var(--c); color: #fff; width: 80px; height: 74px; margin-top: 40px; }
.node.next::before { content: ""; position: absolute; inset: -9px; border-radius: 50%; border: 4px solid var(--c); opacity: .35; animation: pulse 1.8s ease-out infinite; }
.node .start { position: absolute; bottom: calc(100% + 10px); left: 50%; transform: translateX(-50%); background: var(--surface); color: var(--c); border: 2px solid var(--line); font: 800 14px/1 var(--display); padding: 7px 12px; border-radius: 12px; white-space: nowrap; letter-spacing: .04em; animation: bob 1.6s ease-in-out infinite; }
.node .start::after { content: ""; position: absolute; top: 100%; left: 50%; margin-left: -6px; border: 6px solid transparent; border-top-color: var(--surface); }
.node svg { width: 30px; height: 30px; }
.node.chest { border-radius: 16px; width: 74px; height: 62px; }
.node.chest.ready { background: var(--turmeric); color: #3A2600; animation: wiggle 2.4s ease-in-out infinite; }
.node.chest.opened { background: var(--surface); color: var(--gold); box-shadow: inset 0 0 0 3px var(--gold); }
@keyframes pulse { from { transform: scale(.9); opacity: .55; } to { transform: scale(1.18); opacity: 0; } }
@keyframes bob { 50% { transform: translateX(-50%) translateY(-4px); } }
@keyframes wiggle { 0%, 80%, 100% { transform: translateX(var(--x)) rotate(0); } 85% { transform: translateX(var(--x)) rotate(-7deg); } 90% { transform: translateX(var(--x)) rotate(7deg); } 95% { transform: translateX(var(--x)) rotate(-4deg); } }

/* ── cards & lists ── */
.card { background: var(--surface); border-radius: var(--r); padding: 16px; box-shadow: var(--shadow); display: grid; gap: 10px; }
.tag { display: inline-block; font: 700 11px/1 var(--body); letter-spacing: .07em; text-transform: uppercase; padding: 5px 8px; border-radius: 7px; background: var(--sunk); color: var(--muted); white-space: nowrap; }
.tag.dialect { background: var(--madder); color: #fff; }
.tag.onband { background: rgba(255,255,255,.2); color: #fff; }
.primary, .secondary { border-radius: 16px; padding: 15px 18px; font: 800 18px/1 var(--display); width: 100%; letter-spacing: .02em; }
.primary { background: var(--indigo); color: var(--on-indigo); border: 0; box-shadow: inset 0 -5px 0 rgba(0,0,0,.2); }
.primary:active { transform: translateY(2px); box-shadow: inset 0 -2px 0 rgba(0,0,0,.2); }
.primary.go { background: var(--ok); color: #fff; }
.primary.warn { background: var(--bad); color: #fff; }
.primary[disabled] { opacity: .45; }
.secondary { background: var(--surface); border: 2px solid var(--line); color: var(--ink); }
.pair { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

.scene-card { border: 0; padding: 0; text-align: left; background: var(--surface); border-radius: var(--r); overflow: hidden; box-shadow: var(--shadow); display: grid; grid-template-columns: 92px minmax(0,1fr); }
.scene-card .art { display: grid; place-items: center; color: #fff; font: 800 34px/1 var(--display); }
.scene-card .body { padding: 14px; display: grid; gap: 4px; }
.stars { display: flex; gap: 2px; }
.stars svg { width: 20px; height: 20px; }
.star-on { fill: var(--gold); } .star-off { fill: var(--line); }

.strength { display: grid; gap: 10px; }
.sbar { display: grid; grid-template-columns: 110px minmax(0,1fr) 40px; gap: 10px; align-items: center; font-size: 14px; }
.sbar .meter { height: 10px; border-radius: 99px; background: var(--sunk); overflow: hidden; }
.sbar .meter i { display: block; height: 100%; border-radius: 99px; }
.sbar span:last-child { text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; }

.badges { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 12px; }
.badge { display: grid; justify-items: center; gap: 6px; text-align: center; font-size: 13px; line-height: 1.25; }
.medal { width: 64px; height: 64px; border-radius: 50%; display: grid; place-items: center; color: #fff; position: relative;
  background: radial-gradient(circle at 50% 50%, transparent 0 22px, rgba(255,255,255,.35) 23px 25px, transparent 26px), var(--c); box-shadow: inset 0 -5px 0 rgba(0,0,0,.2); }
.medal svg { width: 28px; height: 28px; }
.badge.locked .medal { background: var(--sunk); color: var(--muted); box-shadow: none; }
.badge.locked { color: var(--muted); }

.level { display: grid; gap: 8px; }
.lvl-meter { height: 14px; background: var(--sunk); border-radius: 99px; overflow: hidden; }
.lvl-meter i { display: block; height: 100%; background: linear-gradient(90deg, var(--turmeric), var(--madder)); border-radius: 99px; }
.bigstats { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 10px; }
.bigstat { background: var(--surface); border-radius: 16px; padding: 12px; box-shadow: var(--shadow); display: grid; gap: 2px; }
.bigstat b { font: 800 26px/1 var(--display); font-variant-numeric: tabular-nums; }
.bigstat span { font-size: 13px; color: var(--muted); }

/* ── exercise ── */
.ex { display: grid; gap: 18px; }
.exbar { display: flex; align-items: center; gap: 12px; }
.x { border: 0; background: none; font-size: 30px; line-height: 1; padding: 2px 6px; color: var(--muted); }
.progress { flex: 1; height: 16px; background: var(--sunk); border-radius: 99px; overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--ok); border-radius: 99px; transition: width .35s cubic-bezier(.3,1.4,.6,1); box-shadow: inset 0 4px 0 rgba(255,255,255,.3); }
.combo { font: 800 15px/1 var(--display); color: var(--gold); display: flex; align-items: center; gap: 2px; min-width: 52px; justify-content: flex-end; font-variant-numeric: tabular-nums; }
.combo svg { width: 20px; height: 20px; }
.combo.hot { animation: pop .3s ease-out; }
.prompt { font: 800 27px/1.2 var(--display); overflow-wrap: anywhere; }
.playrow { display: flex; gap: 12px; align-items: center; }
.big-play { width: 96px; height: 96px; border-radius: 26px; border: 0; background: var(--indigo); color: var(--on-indigo); display: grid; place-items: center; box-shadow: inset 0 -6px 0 rgba(0,0,0,.22); }
.big-play svg { width: 44px; height: 44px; }
.big-play:active { transform: translateY(3px); box-shadow: inset 0 -3px 0 rgba(0,0,0,.22); }
.slow { border: 2px solid var(--line); background: var(--surface); border-radius: 16px; width: 60px; height: 60px; display: grid; place-items: center; color: var(--muted); }
.slow svg { width: 30px; height: 30px; }
.slow[aria-pressed="true"] { border-color: var(--indigo); color: var(--indigo); }
.opts { display: grid; gap: 10px; }
.opt { text-align: left; background: var(--surface); border: 2px solid var(--line); border-bottom-width: 5px; border-radius: 16px; padding: 13px 16px; font-size: 18px; overflow-wrap: anywhere; }
.opt:active { transform: translateY(3px); border-bottom-width: 2px; }
.opt.right { border-color: var(--ok); background: var(--ok-soft); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); animation: shake .35s; }
.opt[disabled] { cursor: default; }
.answer-line { display: flex; gap: 8px; flex-wrap: wrap; min-height: 58px; padding-bottom: 8px; border-bottom: 2px dashed var(--line); align-content: flex-start; }
.tiles { display: flex; gap: 8px; flex-wrap: wrap; }
.tile { background: var(--surface); border: 2px solid var(--line); border-bottom-width: 5px; border-radius: 14px; padding: 7px 14px; font-size: 18px; }
.tile.used { visibility: hidden; }
.learn { padding: 20px; gap: 12px; border-top: 6px solid var(--c, var(--indigo)); }
.roman { font: 800 34px/1.15 var(--display); color: var(--indigo); overflow-wrap: anywhere; }
.meaning { font-size: 19px; }
.note { font-size: 14px; color: var(--muted); border-left: 3px solid var(--turmeric); padding-left: 10px; }
.src { font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
.src a { color: inherit; }

/* feedback sheet */
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 25; padding-block: 18px calc(18px + env(safe-area-inset-bottom, 0px)); animation: up .22s cubic-bezier(.2,1.2,.5,1); }
.sheet .col { display: grid; gap: 10px; }
.sheet.good { background: var(--ok-soft); color: var(--ok); }
.sheet.bad { background: var(--bad-soft); color: var(--bad); }
.sheet .cheer { font: 800 24px/1.1 var(--display); display: flex; align-items: center; gap: 8px; }
.sheet .cheer svg { width: 28px; height: 28px; flex: none; }
.sheet .cheer { flex-wrap: wrap; }
.sheet .cheer small { font: 500 15px/1 var(--body); opacity: .85; }
.sheet .ans { color: var(--ink); font-size: 17px; }
.sheet .ans b { font-family: var(--display); font-size: 19px; }
.sheet .hear { justify-self: start; border: 0; background: rgba(0,0,0,.08); border-radius: 10px; padding: 4px 12px; font-size: 14px; color: var(--ink); }
.xp-pop { position: fixed; z-index: 40; font: 800 22px/1 var(--display); color: var(--gold); pointer-events: none; animation: floatup .9s ease-out forwards; text-shadow: 0 2px 0 rgba(0,0,0,.15); }

/* scene chat */
.chat { display: grid; gap: 10px; }
.bubble { max-width: 86%; padding: 10px 14px; border-radius: 18px; display: grid; gap: 3px; overflow-wrap: anywhere; animation: pop .2s ease-out; }
.bubble.them { background: var(--surface); box-shadow: var(--shadow); border-bottom-left-radius: 5px; justify-self: start; }
.bubble.you { background: var(--indigo); color: var(--on-indigo); border-bottom-right-radius: 5px; justify-self: end; }
.bubble .who { font: 700 11px/1 var(--body); letter-spacing: .08em; text-transform: uppercase; opacity: .7; }
.bubble .r { font: 700 19px/1.3 var(--display); }
.bubble .e { font-size: 14px; opacity: .8; }
.bubble button.play { justify-self: start; border: 0; background: var(--sunk); color: var(--ink); border-radius: 8px; padding: 2px 10px; font-size: 13px; }
.bubble.cue { justify-self: center; max-width: 100%; text-align: center; background: var(--sunk); border: 2px dashed var(--line); }
.seg { display: grid; grid-template-columns: 1fr 1fr; background: var(--sunk); border-radius: 14px; padding: 4px; gap: 4px; }
.seg button { border: 0; background: none; border-radius: 10px; padding: 9px 8px; font: 700 15px/1 var(--display); color: var(--muted); }
.seg button[aria-selected="true"] { background: var(--surface); color: var(--indigo); box-shadow: var(--shadow); }
.grows { display: grid; }
.grow { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 2px 10px; padding-block: 10px; border-top: 1px solid var(--line); align-items: center; }
.grow:first-child { border-top: 0; }
.gwho { font-size: 13px; color: var(--muted); grid-column: 1 / -1; }
.gsay { font: 700 18px/1.3 var(--display); color: var(--indigo); min-width: 0; overflow-wrap: anywhere; }
.gnote { grid-column: 1 / -1; font-size: 13px; color: var(--muted); border-left: 3px solid var(--turmeric); padding-left: 8px; }
.tag.resp { background: var(--indigo); color: var(--on-indigo); text-transform: none; letter-spacing: 0; }
.chip { border: 2px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 14px; font-size: 14px; font-weight: 600; }
.chip[aria-pressed="true"] { background: var(--indigo); color: var(--on-indigo); border-color: var(--indigo); }
.toolbar { display: flex; gap: 8px; flex-wrap: wrap; }

/* phrasebook + family */
.search { width: 100%; padding: 13px 16px; border-radius: 16px; border: 2px solid var(--line); background: var(--surface); color: var(--ink); font: inherit; }
.list { display: grid; gap: 10px; }
.item { background: var(--surface); border-radius: 16px; padding: 12px 14px; box-shadow: var(--shadow); display: grid; grid-template-columns: auto minmax(0,1fr); gap: 4px 12px; align-items: start; }
.item .play { grid-row: span 3; width: 44px; height: 44px; border-radius: 12px; border: 0; background: var(--sunk); color: var(--indigo); display: grid; place-items: center; }
.item .play svg { width: 22px; height: 22px; }
.item .r { font: 700 19px/1.3 var(--display); }
.verdict { display: flex; gap: 8px; flex-wrap: wrap; grid-column: 2; margin-top: 4px; }
.verdict button { border: 2px solid var(--line); background: var(--surface); border-radius: 12px; padding: 6px 12px; font-size: 14px; font-weight: 600; }
.verdict button[aria-pressed="true"].yes { background: var(--ok); color: #fff; border-color: var(--ok); }
.verdict button[aria-pressed="true"].no { background: var(--bad); color: #fff; border-color: var(--bad); }
.verdict input { flex: 1 1 180px; min-width: 0; padding: 7px 10px; border-radius: 12px; border: 2px solid var(--line); background: var(--bg); color: var(--ink); font: inherit; font-size: 14px; }
.voice-warn { font-size: 13px; color: var(--muted); background: var(--sunk); border-radius: 12px; padding: 9px 12px; }

/* finish screen */
.finish { display: grid; gap: 18px; justify-items: center; text-align: center; padding-top: 20px; }
.finish .trophy { width: 120px; height: 120px; border-radius: 50%; display: grid; place-items: center; color: #3A2600;
  background: radial-gradient(circle, transparent 0 48px, rgba(255,255,255,.4) 49px 52px, transparent 53px), var(--turmeric); box-shadow: inset 0 -8px 0 rgba(0,0,0,.18); animation: pop .5s cubic-bezier(.2,1.6,.5,1); }
.finish .trophy svg { width: 60px; height: 60px; }
.finish h2 { font-size: 30px; }
.finish .bigstats { width: 100%; }
.unlock { width: 100%; display: grid; grid-template-columns: auto minmax(0,1fr); gap: 12px; align-items: center; text-align: left; }
.unlock .medal { width: 52px; height: 52px; }

#confetti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 50; }
.toast { position: fixed; top: calc(env(safe-area-inset-top, 0px) + 64px); left: 50%; transform: translateX(-50%); z-index: 45; background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 14px; font-weight: 600; box-shadow: var(--shadow); animation: drop .3s ease-out; max-width: calc(100% - 32px); }

@keyframes pop { from { transform: scale(.94); opacity: .3; } to { transform: none; opacity: 1; } }
@keyframes up { from { transform: translateY(100%); } to { transform: none; } }
@keyframes drop { from { transform: translate(-50%, -20px); opacity: 0; } to { transform: translate(-50%, 0); opacity: 1; } }
@keyframes shake { 25% { transform: translateX(-6px); } 50% { transform: translateX(6px); } 75% { transform: translateX(-3px); } }
@keyframes floatup { from { transform: translateY(0); opacity: 1; } to { transform: translateY(-60px); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
