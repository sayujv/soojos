<title>Apollo Family Check</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhai+2:wght@600;800&family=Hind+Vadodara:wght@400;500;600&display=swap">
<style>
/* Layout: one calm reading column for a native speaker on a phone. Big type, big
   buttons, one sentence per card. Same Kutch palette as Apollo, used sparingly. */
:root {
  --bg: #F3F4F9; --surface: #FFFFFF; --sunk: #E6E8F3; --ink: #181C36; --muted: #555C7E; --line: #D3D7E8;
  --indigo: #2A3990; --on-indigo: #FFFFFF; --madder: #B8312A; --turmeric: #E4A11B; --ok: #1F8150; --ok-soft: #DCF3E5; --bad: #B8312A; --bad-soft: #F9E0DD; --amber-soft: #FBEFD2;
  --band: #1B2766;
  --display: "Baloo Bhai 2", "Hind Vadodara", system-ui, sans-serif;
  --body: "Hind Vadodara", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0E1124; --surface: #181C36; --sunk: #232848; --ink: #ECEEF8; --muted: #A6ABCB; --line: #2D3259;
  --indigo: #93A0F5; --on-indigo: #0E1124; --madder: #F27B6F; --turmeric: #F5BC45; --ok: #5FCB90; --ok-soft: #15301F; --bad: #F27B6F; --bad-soft: #3A1C1F; --amber-soft: #3A2E12; --band: #141B4D;
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0E1124; --surface: #181C36; --sunk: #232848; --ink: #ECEEF8; --muted: #A6ABCB; --line: #2D3259;
  --indigo: #93A0F5; --on-indigo: #0E1124; --madder: #F27B6F; --turmeric: #F5BC45; --ok: #5FCB90; --ok-soft: #15301F; --bad: #F27B6F; --bad-soft: #3A1C1F; --amber-soft: #3A2E12; --band: #141B4D;
  color-scheme: dark; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); font: 18px/1.55 var(--body); margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--turmeric); outline-offset: 2px; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--band); }
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background-color: var(--band); color: #fff;
  background-image: radial-gradient(circle, rgba(242,123,111,.5) 0 2.2px, transparent 2.7px), radial-gradient(circle, rgba(255,255,255,.14) 0 1.7px, transparent 2.2px);
  background-size: 20px 20px; background-position: 0 0, 10px 10px; }
.top .col { display: flex; align-items: center; gap: 10px; padding-block: 10px; }
.top b { font: 800 20px/1 var(--display); margin-right: auto; }
#status { font-size: 13px; background: rgba(0,0,0,.3); border-radius: 999px; padding: 3px 10px; max-width: 60%; line-height: 1.3; }
#status[data-s="error"], #status[data-s="local"] { background: rgba(228,161,27,.85); color: #2A1B00; }
.col { max-width: 640px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
#view { padding-block: 18px 60px; display: grid; gap: 16px; }
h1 { font: 800 30px/1.15 var(--display); margin: 4px 0 8px; text-wrap: balance; }
h2 { font: 800 26px/1.2 var(--display); margin: 6px 0 2px; }
p { margin: 0 0 8px; }
.small, .ex, .ctx { font-size: 15px; color: var(--muted); }
.hero { background: var(--surface); border-radius: 18px; padding: 18px; border-top: 6px solid var(--madder); }
.kicker { font: 700 16px/1.2 var(--display); color: var(--madder); margin: 0; }
.name { display: grid; gap: 6px; font-weight: 600; }
.name input, .say { width: 100%; font: inherit; padding: 12px 14px; border-radius: 14px; border: 2px solid var(--line); background: var(--surface); color: var(--ink); }
.overall { display: flex; align-items: center; gap: 12px; font-size: 15px; color: var(--muted); font-variant-numeric: tabular-nums; }
.bar { flex: 1; height: 12px; background: var(--sunk); border-radius: 99px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--ok); border-radius: 99px; }
.secs { display: grid; gap: 10px; }
.sec { display: flex; align-items: center; justify-content: space-between; gap: 12px; text-align: left; background: var(--surface); border: 2px solid var(--line); border-radius: 16px; padding: 14px 16px; }
.sec b { display: block; font: 700 19px/1.25 var(--display); }
.sec small { color: var(--muted); font-size: 14px; }
.cnt { font: 800 16px/1 var(--display); background: var(--sunk); border-radius: 10px; padding: 8px 10px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.cnt.full { background: var(--ok); color: #fff; }
.sechead { display: grid; gap: 6px; }
.back { justify-self: start; border: 0; background: none; color: var(--indigo); font-weight: 600; padding: 4px 0; }
.toggle { display: flex; gap: 8px; align-items: center; font-size: 15px; color: var(--muted); }
.toggle input { width: 20px; height: 20px; accent-color: var(--indigo); }
.items { display: grid; gap: 14px; }
.it { background: var(--surface); border-radius: 18px; padding: 16px; display: grid; gap: 10px; border-left: 6px solid var(--line); }
.it.done { border-left-color: var(--ok); }
.it .ctx { margin: 0; text-transform: uppercase; letter-spacing: .05em; font-size: 12px; font-weight: 600; }
.en, .q { font: 700 20px/1.3 var(--display); margin: 0; }
.ours { display: flex; gap: 12px; align-items: center; background: var(--sunk); border-radius: 14px; padding: 10px 12px; }
.ours > div { min-width: 0; display: grid; gap: 2px; }
.ours b { font: 800 22px/1.25 var(--display); color: var(--indigo); overflow-wrap: anywhere; }
.gu { font-size: 19px; }
.play { flex: none; width: 46px; height: 46px; border-radius: 12px; border: 0; background: var(--indigo); color: var(--on-indigo); font-size: 18px; }
.tag { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; background: var(--madder); color: #fff; border-radius: 6px; padding: 2px 6px; vertical-align: middle; }
.vb { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 8px; }
.vb button { border: 2px solid var(--line); background: var(--surface); border-radius: 14px; padding: 12px 8px; font-weight: 600; font-size: 16px; }
.vb button[data-v="yes"][aria-pressed="true"], .vb button[data-c="yes"][aria-pressed="true"] { background: var(--ok); border-color: var(--ok); color: #fff; }
.vb button[data-v="close"][aria-pressed="true"], .vb button[data-v="some"][aria-pressed="true"] { background: var(--turmeric); border-color: var(--turmeric); color: #2A1B00; }
.vb button[data-v="no"][aria-pressed="true"], .vb button[data-c="no"][aria-pressed="true"] { background: var(--bad); border-color: var(--bad); color: #fff; }
.vb button[data-v="unsure"][aria-pressed="true"] { background: var(--muted); border-color: var(--muted); color: var(--surface); }
.claim { background: var(--amber-soft); border-radius: 14px; padding: 10px 12px; display: grid; gap: 8px; font-size: 16px; }
.claim p { margin: 0; }
.lbl { font-weight: 700; margin-right: 4px; }
.vb.small { grid-template-columns: auto 1fr 1fr; align-items: center; }
.vb.small span { font-size: 14px; color: var(--muted); }
.vb.small button { padding: 8px; }
.more { border: 2px solid var(--indigo); background: var(--surface); color: var(--indigo); border-radius: 16px; padding: 14px; font: 700 18px/1 var(--display); }
.foot { display: grid; gap: 6px; }
.ghost { border: 2px solid var(--line); background: var(--surface); border-radius: 14px; padding: 12px; font-weight: 600; }
.copybox { width: 100%; height: 160px; font: 13px/1.4 ui-monospace, monospace; border-radius: 12px; border: 2px solid var(--line); background: var(--surface); color: var(--ink); padding: 8px; }
.empty { text-align: center; color: var(--muted); padding: 30px 0; }
</style>

<header class="top"><div class="col"><b>Family check</b><span id="status" data-s="local" role="status">Loading…</span></div></header>
<main class="col" id="view" aria-live="polite"></main>

<script src="data.js"></script>
<script src="grammar.js"></script>
<script src="speech.js"></script>
<script src="review.js"></script>
